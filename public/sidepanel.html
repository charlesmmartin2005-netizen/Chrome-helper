<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Summarizer</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <nav id="views" class="views" aria-label="Panel sections">
      <button type="button" data-view="page" class="current">Page</button>
      <button type="button" data-view="tabs">Tabs</button>
      <button type="button" data-view="notebook">Notebook</button>
    </nav>

    <section id="page-view" class="view">
    <header class="page">
      <img id="favicon" alt="" width="16" height="16" hidden />
      <div class="page-text">
        <div id="page-title" class="page-title">Page Summarizer</div>
        <div id="page-host" class="page-host"></div>
      </div>
    </header>

    <div class="toolbar">
      <button id="primary" class="primary" type="button">Summarize</button>
      <button id="copy" type="button" hidden>Copy</button>
      <button id="listen" type="button" title="Read the summary aloud" hidden>Listen</button>
      <span class="spacer"></span>
      <label class="switch" title="Summarize automatically when you open or switch pages">
        <input id="auto" type="checkbox" />
        <span class="track" aria-hidden="true"></span>
        Auto
      </label>
      <button id="settings" class="icon" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>

    <div class="style-row">
      <label for="style">Written for</label>
      <select id="style" aria-label="Who the summary is written for"></select>
      <span class="spacer"></span>
      <button id="save" type="button" title="Save this summary and its source to the notebook" hidden>Save</button>
    </div>

    <main>
      <div id="skipped" class="notice skipped" hidden>
        <p class="skipped-title">What you skipped on <a id="skipped-link" href="#"></a></p>
        <div id="skipped-status" class="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="skipped-status-text"></span>
        </div>
        <div id="skipped-text" class="summary"></div>
        <p id="skipped-meta" class="skipped-meta"></p>
        <button id="skipped-dismiss" type="button">Dismiss</button>
      </div>
      <div id="status" class="status" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text"></span>
      </div>
      <div id="notice" class="notice" hidden>
        <p id="notice-text"></p>
        <button id="notice-action" type="button" hidden></button>
      </div>
      <article id="summary" class="summary" aria-live="polite"></article>
      <p id="meta" class="meta" hidden></p>
      <div id="seen" class="notice seen" hidden>
        <p id="seen-text"></p>
        <button id="seen-action" type="button"></button>
      </div>

      <section id="chat" class="chat" aria-label="Questions about this page" hidden>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <div id="tools" class="tools"></div>
        <div id="onpage-note" class="notice onpage" hidden>
          <p id="onpage-text"></p>
          <button id="onpage-action" type="button"></button>
        </div>
        <form id="ask-form" class="ask">
          <textarea id="ask-input" rows="1" placeholder="Ask a question about this page…" aria-label="Ask a question about this page"></textarea>
          <button id="ask-send" class="primary" type="submit">Ask</button>
        </form>
      </section>
    </main>
    </section>

    <section id="tabs-view" class="view" hidden>
      <main>
        <p class="lead">Summarize everything you have open, or pick two or three tabs to compare.</p>
        <div id="tabs-list" class="tabs-list"></div>
        <div class="tabs-actions">
          <button id="digest" class="primary" type="button">Digest all tabs</button>
          <button id="compare" type="button" disabled>Compare selected</button>
        </div>
        <div id="tabs-confirm" class="notice" hidden>
          <p id="tabs-estimate"></p>
          <button id="tabs-run" class="primary" type="button">Run digest</button>
          <button id="tabs-cancel" type="button">Cancel</button>
        </div>
        <div id="tabs-status" class="status" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="tabs-status-text"></span>
        </div>
        <div id="tabs-notice" class="notice" hidden><p id="tabs-notice-text"></p></div>
        <article id="tabs-result" class="summary" aria-live="polite"></article>
        <p id="tabs-meta" class="meta" hidden></p>
      </main>
    </section>

    <section id="notebook-view" class="view" hidden>
      <main>
        <div class="project-row">
          <label for="project">Project</label>
          <select id="project"></select>
          <button id="new-project" type="button" title="New project">+</button>
          <button id="delete-project" type="button" title="Delete this project and everything saved in it">Delete</button>
        </div>
        <form id="new-project-form" class="row" hidden>
          <input id="new-project-name" type="text" maxlength="80" placeholder="Project name, e.g. Eminent domain paper" />
          <button class="primary" type="submit">Add</button>
        </form>
        <p id="notebook-empty" class="lead" hidden>Nothing saved here yet. On the Page view, click <b>Save</b> under a summary.</p>
        <ol id="notebook-list" class="notebook-list"></ol>
        <div class="tabs-actions">
          <button id="synthesize" class="primary" type="button">Write a synthesis</button>
          <button id="notebook-copy" type="button">Copy as Markdown</button>
          <button id="notebook-download" type="button">Download</button>
        </div>
        <div id="notebook-status" class="status" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="notebook-status-text"></span>
        </div>
        <div id="notebook-notice" class="notice" hidden><p id="notebook-notice-text"></p></div>
        <article id="synthesis" class="summary" aria-live="polite"></article>
        <ol id="synthesis-sources" class="sources" hidden></ol>
        <p id="synthesis-meta" class="meta" hidden></p>
      </main>
    </section>

    <footer>
      <p>Summaries are written by Claude and can contain mistakes.</p>
      <p class="footer-tools">
        <span id="version"></span> ·
        <button id="debug" class="link" type="button">Copy debug info</button>
      </p>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
