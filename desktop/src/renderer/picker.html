<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Select an area</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
      #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
      #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); }
      #box { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); display: none; }
      #hint { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
        background: rgba(0, 0, 0, 0.7); color: #fff; font: 14px system-ui, sans-serif; pointer-events: none; }
      #size { position: absolute; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.7); color: #fff; font: 12px system-ui, sans-serif; display: none; pointer-events: none; }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="dim"></div>
    <div id="box"></div>
    <div id="size"></div>
    <div id="hint">Drag to select the part of the screen to summarize · Esc to cancel</div>
    <script src="picker.js"></script>
  </body>
</html>
